<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">JN TELAS</title><desc id="desc">Logo JN TELAS com controle, raio e círculo neon azul e laranja</desc>
<defs>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19dfff"/><stop offset=".48" stop-color="#2376ff"/><stop offset=".58" stop-color="#ff7a18"/><stop offset="1" stop-color="#ffd21a"/></linearGradient>
  <linearGradient id="j" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfffff"/><stop offset=".28" stop-color="#1ce7ff"/><stop offset="1" stop-color="#0067ff"/></linearGradient>
  <linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#d9e0ea"/><stop offset="1" stop-color="#ff8b20"/></linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff"/><stop offset=".28" stop-color="#dce4ee"/><stop offset=".48" stop-color="#19e5ff"/><stop offset="1" stop-color="#008bff"/></linearGradient>
  <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="warmGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<circle cx="500" cy="500" r="438" fill="#050814" fill-opacity=".96" stroke="#0a1020" stroke-width="18"/>
<circle cx="500" cy="500" r="432" fill="none" stroke="url(#ring)" stroke-width="18" filter="url(#blueGlow)"/>
<circle cx="500" cy="500" r="417" fill="none" stroke="url(#ring)" stroke-width="3" opacity=".9"/>
